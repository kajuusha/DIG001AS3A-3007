name: Deploy Viikko 3

on:
  push:
    branches:
      - main
    paths:
      - 'viikko3/**'
      - '.github/workflows/deploy-viikko3.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viikko3/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: viikko3

      - name: Build
        run: npm run build
        working-directory: viikko3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: viikko3/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
